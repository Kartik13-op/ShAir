<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShAir - Debug Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-md mx-auto p-4">
        <h1 class="text-2xl font-bold text-center text-emerald-500 mb-4">ShAir Debug</h1>
        
        <div class="space-y-4">
            <button onclick="startCamera()" class="w-full bg-emerald-600 py-3 rounded-lg font-bold">Start Receiver</button>
            
            <div class="relative bg-slate-900 rounded-lg overflow-hidden">
                <video id="video" class="w-full" autoplay playsinline></video>
                <div id="debugOverlay" class="absolute top-2 left-2 bg-black/50 text-emerald-400 text-[10px] p-2 rounded">Initializing...</div>
            </div>

            <div id="gridContainer" class="grid grid-cols-8 gap-1"></div>
            <div id="status" class="text-xs font-mono text-center text-slate-400">Waiting for QR...</div>
        </div>
    </div>

    <script>
        const debug = document.getElementById('debugOverlay');
        let receivedChunks = new Map();
        let currentSessionId = null;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                document.getElementById('video').srcObject = stream;
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                function tick() {
                    const video = document.getElementById('video');
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                        ctx.drawImage(video, 0, 0);
                        const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
                        const code = jsQR(data, canvas.width, canvas.height);
                        
                        if (code) {
                            debug.innerText = "QR Detected!";
                            handleCode(JSON.parse(code.data));
                        } else {
                            debug.innerText = "Scanning...";
                        }
                    }
                    requestAnimationFrame(tick);
                }
                tick();
            } catch (err) { alert("Camera Error: " + err.message); }
        }

        function handleCode(obj) {
            if (obj.sessionId !== currentSessionId) {
                currentSessionId = obj.sessionId;
                receivedChunks.clear();
                document.getElementById('gridContainer').innerHTML = Array.from({length: obj.total}, (_, i) => `<div id="c-${i}" class="h-2 bg-slate-800 rounded"></div>`).join('');
            }
            if (!receivedChunks.has(obj.index)) {
                receivedChunks.set(obj.index, obj.data);
                document.getElementById(`c-${obj.index}`).className = "h-2 bg-emerald-500 rounded";
                document.getElementById('status').innerText = `Captured ${receivedChunks.size}/${obj.total}`;
                if (receivedChunks.size === obj.total) finalize(obj);
            }
        }

        function finalize(obj) {
            const bytes = new Uint8Array(Array.from({length: obj.total}, (_, i) => atob(receivedChunks.get(i))).join('').split('').map(c => c.charCodeAt(0)));
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([bytes]));
            a.download = obj.name; a.click();
            alert("File Downloaded!");
        }
    </script>
</body>
</html>
