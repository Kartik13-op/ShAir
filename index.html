<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShAir - Fast Optical Transfer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-xl mx-auto p-6">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-black text-emerald-500 tracking-tighter">ShAir</h1>
            <p class="text-slate-400">Offline Optical Data Transfer</p>
        </header>
        
        <!-- Tabs -->
        <div class="grid grid-cols-2 gap-2 mb-8 bg-slate-900 p-1 rounded-xl">
            <button onclick="showTab('sender')" class="py-3 rounded-lg font-semibold hover:bg-slate-800 transition">Sender</button>
            <button onclick="showTab('receiver')" class="py-3 rounded-lg font-semibold hover:bg-slate-800 transition">Receiver</button>
        </div>

        <!-- Sender -->
        <div id="sender" class="tab-content space-y-4">
            <div class="border-2 border-dashed border-slate-700 rounded-2xl p-8 text-center hover:border-emerald-500 transition">
                <input type="file" id="fileInput" class="hidden">
                <label for="fileInput" class="cursor-pointer text-emerald-400 font-bold">Select or Drop File</label>
            </div>
            <div class="flex items-center gap-4 bg-slate-900 p-4 rounded-xl">
                <label class="text-sm">FPS:</label>
                <input type="number" id="fpsInput" value="15" class="bg-slate-800 p-2 w-20 rounded-lg text-center font-mono">
                <button onclick="startTransmission()" class="flex-grow bg-emerald-600 py-2 rounded-lg font-bold hover:bg-emerald-500">Broadcast</button>
            </div>
            <div id="canvasContainer" class="flex justify-center bg-white p-2 rounded-lg"></div>
            <div id="progress" class="font-mono text-xs text-center text-slate-400"></div>
        </div>

        <!-- Receiver -->
        <div id="receiver" class="tab-content hidden space-y-4">
            <button onclick="startCamera()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold hover:bg-emerald-500">Scan QR Stream</button>
            <div class="relative rounded-2xl overflow-hidden aspect-video bg-slate-900">
                <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
                <div class="absolute inset-0 border-4 border-emerald-500/50 rounded-2xl"></div>
            </div>
            <div id="gridContainer" class="grid grid-cols-8 gap-1"></div>
            <div id="status" class="font-mono text-xs text-center text-slate-400"></div>
        </div>
    </div>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tab).classList.remove('hidden');
        }

        let qrcode;
        let transmissionFrame = 0;
        let lastFrameTime = 0;

        async function startTransmission() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert("Select a file first");
            
            const fps = parseInt(document.getElementById('fpsInput').value) || 15;
            const buffer = await file.arrayBuffer();
            const uint8 = new Uint8Array(buffer);
            const CHUNK_SIZE = 512; // Increased size for efficiency
            const total = Math.ceil(uint8.length / CHUNK_SIZE);
            const sessionId = Date.now();
            const chunks = Array.from({length: total}, (_, i) => JSON.stringify({
                sessionId, index: i, total,
                data: btoa(String.fromCharCode(...uint8.slice(i*CHUNK_SIZE, (i+1)*CHUNK_SIZE))),
                name: file.name
            }));

            if (!qrcode) qrcode = new QRCode(document.getElementById("canvasContainer"), { width: 300, height: 300 });

            function loop(time) {
                if (time - lastFrameTime > 1000 / fps) {
                    qrcode.makeCode(chunks[transmissionFrame]);
                    document.getElementById('progress').innerText = `Sending: ${transmissionFrame + 1}/${total}`;
                    transmissionFrame = (transmissionFrame + 1) % total;
                    lastFrameTime = time;
                }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        let receivedChunks = new Map();
        let currentSessionId = null;

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('video').srcObject = stream;
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            function tick() {
                const video = document.getElementById('video');
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0);
                    const code = jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data, canvas.width, canvas.height);
                    if (code) handleCode(JSON.parse(code.data));
                }
                requestAnimationFrame(tick);
            }
            tick();
        }

        function handleCode(obj) {
            if (obj.sessionId !== currentSessionId) {
                currentSessionId = obj.sessionId;
                receivedChunks.clear();
                document.getElementById('gridContainer').innerHTML = Array.from({length: obj.total}, (_, i) => `<div id="c-${i}" class="h-3 bg-slate-800 rounded"></div>`).join('');
            }
            if (!receivedChunks.has(obj.index)) {
                receivedChunks.set(obj.index, obj.data);
                document.getElementById(`c-${obj.index}`).className = "h-3 bg-emerald-500 rounded animate-pulse";
                document.getElementById('status').innerText = `Captured ${receivedChunks.size}/${obj.total}`;
                if (receivedChunks.size === obj.total) finalize(obj);
            }
        }

        function finalize(obj) {
            const bytes = new Uint8Array(Array.from({length: obj.total}, (_, i) => atob(receivedChunks.get(i))).join('').split('').map(c => c.charCodeAt(0)));
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([bytes]));
            a.download = obj.name;
            a.click();
        }
    </script>
</body>
</html>
